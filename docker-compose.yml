services:

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile

    container_name: apollo_backend

    restart: unless-stopped
    user: "root"
    working_dir: /var/www

    volumes:
      - ./app/backend:/var/www
      - backend_vendor:/var/www/vendor
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - apollo

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile

    container_name: apollo_frontend

    restart: unless-stopped

    working_dir: /app

    volumes:
      - ./app/frontend:/app
      - /app/node_modules

    ports:
      - "8080:8080"

    networks:
      - apollo

  nginx:
    image: nginx:1.28-alpine

    container_name: apollo_nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./app/backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - backend
      - frontend

    networks:
      - apollo

  postgres:
    image: postgres:17-alpine

    container_name: apollo_postgres

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - apollo

  redis:
    image: redis:8-alpine

    container_name: apollo_redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - apollo

  mailpit:
    image: axllent/mailpit

    container_name: apollo_mailpit

    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"

    networks:
      - apollo

volumes:
  postgres_data:
  redis_data:
  backend_vendor:

networks:
  apollo:
    driver: bridge
